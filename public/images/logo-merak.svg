<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="hkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fond sombre -->
  <rect width="200" height="200" fill="#0f172a" rx="24" />
  
  <!-- Cercle extérieur avec dégradé -->
  <circle cx="100" cy="100" r="80" fill="url(#hkGrad)" opacity="0.15" />
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#hkGrad)" stroke-width="3" />
  
  <!-- Symbole M stylisé -->
  <path d="M60 140 L80 90 L100 140 L120 90 L140 140" fill="none" stroke="url(#hkGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#hkGlow)" />
  
  <!-- Point central -->
  <circle cx="100" cy="100" r="6" fill="#38bdf8" filter="url(#hkGlow)" />
</svg>
